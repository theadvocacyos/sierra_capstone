<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin — Orders</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="container">
    <h1>Orders (Admin)</h1>
    <div class="controls">
      <button id="exportBtn">Export CSV</button>
      <button id="clearBtn">Clear all orders</button>
      <label style="margin-left:1rem">Admin key: <input id="adminKey" type="password" placeholder="admin key" style="margin-left:.5rem"><button id="saveKeyBtn" style="margin-left:.5rem">Save key</button></label>
    </div>
    <table id="ordersTable">
      <thead>
        <tr><th>#</th><th>Name</th><th>Phone</th><th>Address</th><th>Date</th><th>Bouquet</th><th>Qty</th><th>Message</th></tr>
      </thead>
      <tbody></tbody>
    </table>
    <p><a href="index.html">Back to home</a></p>
  </main>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', ()=>{
      renderAdmin();
      document.getElementById('exportBtn').addEventListener('click', exportCSV);
      document.getElementById('clearBtn').addEventListener('click', clearOrders);
      const input = document.getElementById('adminKey');
      const saved = sessionStorage.getItem('adminKey');
      if(saved) input.value = saved;
      document.getElementById('saveKeyBtn').addEventListener('click', ()=>{
        const v = input.value.trim();
        if(!v){ sessionStorage.removeItem('adminKey'); alert('Admin key cleared'); return }
        sessionStorage.setItem('adminKey', v); alert('Admin key saved in session');
      });
    });
  </script>
</body>
</html>
