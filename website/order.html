<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Place Order — Flower Delivery</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="container">
    <h1>Place a Flower Order</h1>
    <form id="orderForm">
      <label>Full name<input type="text" id="name" required></label>
      <label>Phone<input type="tel" id="phone" required></label>
      <label>Delivery address<textarea id="address" required></textarea></label>
      <label>Delivery date<input type="date" id="date" required></label>
      <label>Bouquet type
        <select id="bouquet">
          <option value="Classic">Classic — mixed seasonal</option>
          <option value="Roses">Roses — a dozen roses</option>
          <option value="Premium">Premium — lilies & roses</option>
        </select>
      </label>
      <div class="bouquet-preview" aria-live="polite">
        <img id="bouquetImage" src="images/classic.svg" alt="Classic bouquet preview">
        <div class="bouquet-details">
          <strong id="bouquetTitle">Classic — mixed seasonal</strong>
          <p id="bouquetDescription">A bright mixed bouquet of seasonal blooms, perfect for everyday gifting.</p>
        </div>
      </div>
      <label>Quantity<input type="number" id="quantity" min="1" value="1"></label>
      <label>Message (card)<textarea id="message" maxlength="250"></textarea></label>
      <button type="submit">Submit order</button>
    </form>
    <div id="confirmation" class="hidden"></div>
    <p><a href="index.html">Back to home</a></p>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
